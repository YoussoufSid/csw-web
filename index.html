<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F5C3A">
<meta name="mobile-web-app-capable" content="yes">
<title>CSW Gestion — Complexe Scolaire Wassoulou</title>
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22CSW%20Gestion%22%2C%22short_name%22%3A%22CSW%22%2C%22display%22%3A%22standalone%22%2C%22theme_color%22%3A%22%231F5C3A%22%2C%22background_color%22%3A%22%23F4F6F3%22%2C%22start_url%22%3A%22.%22%7D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--g:#1F5C3A;--g2:#2E7D50;--gold:#B8912F;--bg:#F4F6F3;--card:#fff;--ink:#1d2420;--mut:#66706a;--line:#dfe5e0;
--ok:#1e8a4c;--okb:#e2f4e9;--part:#b7791f;--partb:#fdf2dc;--no:#c0392b;--nob:#fbe5e2;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--g);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px #0002}
.logo{width:42px;height:42px;border-radius:11px;background:var(--gold);display:grid;place-items:center;font-weight:700;font-size:15px;letter-spacing:.5px;color:#fff;flex:none}
header h1{font-size:18px;margin:0;line-height:1.15}
header small{display:block;font-size:13px;opacity:.85;font-weight:400}
#sync{margin-left:auto;font-size:12px;background:#ffffff22;padding:3px 9px;border-radius:20px;white-space:nowrap}
main{max-width:860px;margin:0 auto;padding:14px 14px calc(96px + env(safe-area-inset-bottom))}
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -2px 10px #0001}
nav button{flex:1;border:0;background:none;padding:5px 2px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--mut);font-size:12.5px;cursor:pointer;max-width:120px}
nav button svg{width:24px;height:24px}
nav button .ar{font-size:11.5px;line-height:1}
nav button.on{color:var(--g);background:#e8f1eb;font-weight:700}
nav button.pay{color:#fff;background:var(--g);font-weight:700}
nav button.pay.on{background:var(--g2)}
h2{font-size:20px;margin:6px 2px 12px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
h2 .ar{font-size:16px;color:var(--mut);font-weight:600}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0000000f;border:1px solid #e9ede9}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:640px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:#fff;border-radius:var(--r);padding:12px;border:1px solid #e9ede9}
.kpi b{display:block;font-size:22px;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi span{font-size:14px;color:var(--mut)}
.kpi.main{background:var(--g);color:#fff;border:0}.kpi.main span{color:#ffffffcc}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
select,input[type=text],input[type=number],input[type=date],input[type=search],input[type=password],input[type=tel],textarea{width:100%;padding:11px 12px;border:1px solid #cfd8d1;border-radius:11px;background:#fff;font-size:17px;min-height:48px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--g2);outline-offset:0;border-color:transparent}
label.f{display:block;font-weight:700;font-size:15px;margin:12px 2px 5px}
label.f .ar{color:var(--mut);font-weight:600;font-size:14px;margin-left:6px}
.btn{border:0;border-radius:12px;padding:12px 16px;min-height:48px;font-weight:700;cursor:pointer;background:#e8eee9;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.p{background:var(--g);color:#fff}.btn.gold{background:var(--gold);color:#fff}.btn.red{background:var(--nob);color:var(--no)}
.btn.block{width:100%}.btn:disabled{opacity:.5;cursor:not-allowed}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chip{border:1px solid #cfd8d1;background:#fff;border-radius:20px;padding:6px 13px;white-space:nowrap;cursor:pointer;font-size:15px}
.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
.list .it{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.list .it:last-child{border-bottom:0}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none;background:#e8f1eb;color:var(--g)}
.av.F{background:#fbeef3;color:#a23b62}
.nm{font-weight:700;line-height:1.25}.sub{font-size:14px;color:var(--mut)}
.dots{display:flex;gap:3px;margin-top:4px}
.dot{width:12px;height:12px;border-radius:3px;background:var(--nob);border:1px solid #f0c9c4}
.dot.ok{background:var(--ok);border-color:var(--ok)}.dot.part{background:#f2c46d;border-color:#e0aa45}.dot.fut{background:#eef0ee;border-color:#e0e4e0}
.tag{font-size:13px;padding:2px 9px;border-radius:20px;font-weight:700;white-space:nowrap}
.tag.ok{background:var(--okb);color:var(--ok)}.tag.part{background:var(--partb);color:var(--part)}.tag.no{background:var(--nob);color:var(--no)}
.amt{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
table.t{width:100%;border-collapse:collapse;font-size:15.5px}
table.t th{text-align:left;color:var(--mut);font-weight:600;font-size:13.5px;padding:6px 4px;border-bottom:1px solid var(--line)}
table.t td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td.r,table.t th.r{text-align:right}
.bar{height:8px;background:#edf0ed;border-radius:6px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--g2);border-radius:6px}
.months{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mo{border:2px solid #e2e7e3;border-radius:12px;padding:9px 8px;text-align:center;cursor:pointer;background:#fff;user-select:none}
.mo .l{font-weight:700;font-size:15.5px}.mo .s{font-size:12.5px}
.mo.ok{background:var(--okb);border-color:#bfe3cc;cursor:default}.mo.ok .s{color:var(--ok)}
.mo.part .s{color:var(--part)}.mo.no .s{color:var(--no)}
.mo.sel{border-color:var(--g);background:#e8f1eb;box-shadow:inset 0 0 0 1px var(--g)}
.picked{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid #cfd8d1;border-radius:12px;background:#fbfcfb}
.results{border:1px solid var(--line);border-radius:12px;margin-top:6px;max-height:300px;overflow:auto;background:#fff}
.results .it{padding:10px 12px}
.empty{color:var(--mut);text-align:center;padding:26px 10px}
.note{font-size:14px;color:var(--mut)}
.warn{background:#fff6e0;border:1px solid #f1d58f;color:#7a5a12;padding:10px 12px;border-radius:12px;font-size:15px;margin-bottom:12px}
#modal{position:fixed;inset:0;z-index:50;background:#0007;display:none;align-items:flex-end;justify-content:center}
#modal.open{display:flex}
#modal .sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:700px){#modal{align-items:center}#modal .sheet{border-radius:20px}}
.sheet .hd{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sheet .hd h3{margin:0;font-size:19px;flex:1}
.x{border:0;background:#e3e8e4;width:40px;height:40px;border-radius:50%;font-size:22px;cursor:pointer}
.receipt{background:#fff;border:2px solid var(--g);border-radius:14px;padding:16px;position:relative}
.receipt .top{text-align:center;border-bottom:2px solid var(--gold);padding-bottom:8px;margin-bottom:10px}
.receipt .top b{color:var(--g);font-size:17px;display:block}
.receipt .num{display:inline-block;margin-top:4px;font-weight:800;color:#fff;background:var(--gold);padding:2px 12px;border-radius:20px;font-size:16px}
.receipt dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0}
.receipt dt{color:var(--mut);font-size:15px}.receipt dd{margin:0;font-weight:700}
.receipt .big{font-size:24px;color:var(--g)}
.annule{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.annule span{border:4px solid var(--no);color:var(--no);font-weight:800;font-size:34px;padding:4px 18px;transform:rotate(-14deg);border-radius:8px;background:#fffc}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#1d2420;color:#fff;padding:11px 18px;border-radius:12px;opacity:0;transition:.25s;z-index:60;font-size:15.5px;max-width:92vw;text-align:center;pointer-events:none}

#gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#9fd4f2 0%,#d8eefc 46%,#e7f3e4 46%,#b9d9b5 100%);transition:opacity .7s ease,visibility .7s;overflow:hidden;font-family:inherit}
#gate.done{opacity:0;visibility:hidden}
#gate .gw{position:relative;width:min(94vw,560px);aspect-ratio:1/1.02;max-height:96vh;perspective:1100px}
#gate .garch{position:absolute;left:7%;right:7%;top:15%;bottom:9%;border:clamp(8px,2.2vw,14px) solid #D4A62A;border-bottom:0;border-radius:50% 50% 0 0/38% 38% 0 0;background:radial-gradient(ellipse at 50% 85%,#fff7d6 0%,#e9f4ff 70%);box-shadow:inset 0 0 28px #0002,0 6px 18px #0003}
#gate .gpil{position:absolute;bottom:9%;width:11%;height:30%;background:linear-gradient(90deg,#8a8f86,#c9cdc4,#8a8f86);border-radius:4px 4px 0 0;box-shadow:0 4px 10px #0004}
#gate .gpil.l{left:2%}#gate .gpil.r{right:2%}
#gate .gpil i{position:absolute;left:-8%;right:-8%;top:-5%;height:7%;background:#6f756b;border-radius:3px}
#gate .gflag{position:absolute;left:66%;top:-2%;height:17%;width:20%;z-index:4;pointer-events:none}
#gate .gflag .gp{position:absolute;left:0;top:0;bottom:0;width:3.5%;min-width:3px;background:linear-gradient(90deg,#8a6d1a,#f3d36b,#8a6d1a);border-radius:3px;box-shadow:0 2px 4px #0004}
#gate .gflag .gp:before{content:"";position:absolute;left:50%;top:-5px;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:#f3d36b}
#gate .gflag .gf{position:absolute;left:3.5%;top:4%;width:96%;height:55%;display:flex;transform-origin:0 50%;animation:fwv 1.6s ease-in-out infinite alternate;box-shadow:0 3px 8px #0003}
#gate .gflag .gf i{flex:1;display:block;transform-origin:50% 0;animation:fsl 1.1s ease-in-out infinite alternate}
#gate .gflag .gf i:nth-child(1){background:#14b53a}#gate .gflag .gf i:nth-child(2){background:#fcd116;animation-delay:.18s}#gate .gflag .gf i:nth-child(3){background:#ce1126;animation-delay:.36s}
#gate .gflag .gf:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0000 0,#fff4 25%,#0002 45%,#fff3 70%,#0003 100%);animation:fsh 1.1s ease-in-out infinite alternate}
@keyframes fwv{from{transform:perspective(200px) rotateY(-12deg) skewY(-3deg)}to{transform:perspective(200px) rotateY(10deg) skewY(3deg)}}
@keyframes fsl{from{transform:translateY(-4%) scaleY(.96)}to{transform:translateY(5%) scaleY(1.03)}}
@keyframes fsh{from{transform:translateX(-8%)}to{transform:translateX(8%)}}
#gate .gmed{position:absolute;left:50%;top:3%;transform:translateX(-50%);width:27%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff 0 55%,#D4A62A 56% 63%,#1F5C3A 64% 100%);display:flex;align-items:center;justify-content:center;box-shadow:0 5px 14px #0005,0 0 0 4px #f6e3a0;z-index:3}
#gate .gmed img{width:70%;height:70%;object-fit:contain;border-radius:50%}
#gate .gban{position:absolute;left:50%;top:27%;transform:translateX(-50%);z-index:3;background:linear-gradient(180deg,#f8e7a8,#e8c35c);color:#143d27;font-weight:800;font-size:clamp(11px,3vw,17px);padding:.45em 1.6em;border-radius:6px;box-shadow:0 4px 10px #0004;white-space:nowrap;text-align:center;line-height:1.25}
#gate .gban::before,#gate .gban::after{content:"";position:absolute;top:18%;width:1.1em;height:100%;background:#d3a93a;z-index:-1;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,35% 50%)}
#gate .gban::before{left:-.9em}#gate .gban::after{right:-.9em;transform:scaleX(-1)}
#gate .gban small{display:block;font-weight:600;font-size:.72em;color:#2a5a3e}
#gate .gdoors{position:absolute;left:11%;right:11%;top:40%;bottom:9%;display:flex;transform-style:preserve-3d;z-index:2}
#gate .gd{flex:1;display:flex;align-items:flex-end;justify-content:space-around;transition:transform 1.5s cubic-bezier(.5,.05,.2,1);backface-visibility:hidden}
#gate .gd.l{transform-origin:left center}#gate .gd.r{transform-origin:right center}
#gate.open .gd.l{transform:rotateY(-98deg)}#gate.open .gd.r{transform:rotateY(98deg)}
#gate .pc{position:relative;width:11%;border-radius:0 0 3px 3px;background:linear-gradient(90deg,#0f3d26 0%,#2E8B57 35%,#1F5C3A 65%,#0c2f1e 100%);box-shadow:0 3px 6px #0004}
#gate .pc::before{content:"";position:absolute;left:0;right:0;top:-13%;height:14%;background:linear-gradient(90deg,#a97d3a,#e8c27a,#a97d3a);clip-path:polygon(50% 0,0 100%,100% 100%)}
#gate .pc::after{content:"";position:absolute;left:0;right:0;bottom:0;height:9%;background:linear-gradient(90deg,#b88a2a,#f3d57a,#b88a2a)}
#gate .pc b{position:absolute;left:50%;top:-13%;width:26%;height:4%;transform:translateX(-50%);background:#243b2e;border-radius:1px}
#gate .gfl{position:absolute;bottom:0;left:-10%;right:-10%;height:9%;background:repeating-conic-gradient(#1F5C3A 0 25%,#f1e2a6 0 50%) 0 0/9% 100%;opacity:.95;box-shadow:0 -3px 8px #0003}
#gate .gpath{position:absolute;left:11%;right:11%;bottom:9%;height:34%;background:repeating-linear-gradient(0deg,#1F5C3A 0 7%,#f1e2a6 7% 14%);clip-path:polygon(38% 0,62% 0,100% 100%,0 100%);opacity:.55;z-index:1}
#gate .pu{position:absolute;bottom:7%;width:9.5%;opacity:0;z-index:2;pointer-events:none}
#gate .pu svg{width:100%;height:auto;display:block;overflow:visible}
#gate.open .pu{animation:puwalk 3.3s ease-in forwards;animation-delay:var(--d)}
@keyframes puwalk{0%{opacity:0;transform:translate(0,0) scale(1.15)}8%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-205%) scale(.28)}}
#gate .pu .la,#gate .pu .lb{transform-box:fill-box;transform-origin:50% 0;animation:pustep .42s ease-in-out infinite alternate}
#gate .pu .lb{animation-direction:alternate-reverse}
@keyframes pustep{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
#gate .pu .bd{animation:pubob .42s ease-in-out infinite alternate;transform-box:fill-box}
@keyframes pubob{from{transform:translateY(0)}to{transform:translateY(-2px)}}
#gate .gin{position:absolute;left:50%;top:30%;bottom:9%;width:70%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;flex-direction:column;color:#143d27;font-weight:800;text-align:center;opacity:.9}
#gate .gtip{position:absolute;top:100%;margin-top:6px;left:0;right:0;text-align:center;z-index:5;color:#143d27;font-size:13px}
#gate .gtip button{background:#1F5C3A;color:#fff;border:0;border-radius:22px;padding:9px 22px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 3px 10px #0004}
#gate .gtip span{display:block;margin-bottom:6px;opacity:.75}
#toast.show{opacity:1;transform:translateX(-50%)}#toast.u{pointer-events:auto}#toast button{margin-inline-start:12px;background:#FCD116;color:#1d2420;border:0;border-radius:8px;padding:4px 12px;font-weight:700;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.mgrid div{border-radius:10px;padding:7px;text-align:center;font-size:14px}
.mgrid div b{display:block;font-size:14.5px}
.mgrid .ok{background:var(--okb);color:var(--ok)}.mgrid .part{background:var(--partb);color:var(--part)}.mgrid .no{background:var(--nob);color:var(--no)}.mgrid .fut{background:#eef0ee;color:var(--mut)}
textarea.copy{min-height:150px;font-size:14px}
.spin{width:34px;height:34px;border:4px solid #d4ddd6;border-top-color:var(--g);border-radius:50%;animation:s 1s linear infinite;margin:30px auto 10px}
@keyframes s{to{transform:rotate(360deg)}}

.menu{display:grid;grid-template-columns:1fr;gap:10px}@media(min-width:600px){.menu{grid-template-columns:1fr 1fr}}
.mi{text-align:left;background:#fff;border:1px solid #e3e9e4;border-radius:14px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:2px;box-shadow:0 1px 3px #0000000d}
.mi b{font-size:17.5px;color:var(--g)}.mi .ar{color:var(--mut);font-size:15px}.mi small{color:var(--mut);font-size:14px}
.mi:active{background:#eef4ef}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:8px 0 0}dl.kv dt{color:var(--mut);font-size:15px}dl.kv dd{margin:0;font-weight:700}
.pr{width:44px;height:40px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:17px;flex:none}
.pr.P{background:var(--okb);color:var(--ok)}.pr.A{background:var(--no);color:#fff}.pr.R{background:#f2c46d;color:#6b4a0c}
.nrow{padding:7px 0;border-bottom:1px solid var(--line);flex-wrap:nowrap}.nrow:last-child{border-bottom:0}
.nin{width:92px!important;text-align:center;font-weight:700}
h2 .x{margin-right:4px}

html[lang=ar] .ar{display:none!important}
html[dir=rtl] table.t th{text-align:start}html[dir=rtl] table.t td.r,html[dir=rtl] table.t th.r{text-align:end}
html[dir=rtl] .mi{text-align:start}html[dir=rtl] #sync{margin-left:0;margin-right:auto}
html[dir=rtl] h2 .x{transform:scaleX(-1);margin-right:0;margin-left:4px}
html[dir=rtl] .list .it,html[dir=rtl] .row{direction:rtl}
html[dir=rtl] input[type=number],html[dir=rtl] input[type=tel],html[dir=rtl] input[type=date]{direction:ltr;text-align:right}
html[dir=rtl] .nin{text-align:center!important}
#lang{background:#fff;color:var(--g);border:0;border-radius:20px;padding:4px 11px;font-size:13px;font-weight:800;cursor:pointer;margin-inline-start:6px}

/* ===== Nouvelle interface ===== */
:root{--r:16px;--sh:0 1px 2px #0000000a,0 4px 14px #0000000a}
.card,.kpi,.mi{box-shadow:var(--sh);border-color:#e6ebe7}
.kpi{position:relative;overflow:hidden}
.kpi:not(.main)::before{content:"";position:absolute;inset-inline-start:0;top:12px;bottom:12px;width:4px;border-radius:4px;background:var(--gold)}
.kpi.main{background:linear-gradient(135deg,#1F5C3A,#2E7D50)}
h2{font-size:22px}
.mi{border-inline-start:4px solid var(--g2)}
.mi:hover{background:#f6faf7;transform:translateY(-1px);transition:.15s}
.hero{position:relative;display:grid;grid-template-columns:1fr;border-radius:20px;overflow:hidden;margin-bottom:14px;background:linear-gradient(135deg,#17492e 0%,#1F5C3A 45%,#2E7D50 100%);color:#fff;box-shadow:0 6px 24px #1f5c3a33}
.hero .tx{padding:20px 20px 18px;position:relative;z-index:1}
.hero .kick{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:#f3dc9b;font-weight:700}
.hero .kick::before{content:"";width:7px;height:7px;border-radius:50%;background:#f3dc9b}
.hero .verse{font-size:26px;font-weight:700;line-height:1.5;margin:10px 0 2px;font-family:"Amiri","Cairo",serif}
.hero .ref{font-size:13px;color:#f3dc9b;margin-bottom:10px}
.hero .wel{font-size:16px;opacity:.95}
.hero .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.hero .acts .btn{min-height:42px;padding:8px 16px;border-radius:12px}
.hero .acts .btn.ghost{background:#ffffff1f;color:#fff;border:1px solid #ffffff40}
.hero .art{display:none}
.hero::after{content:"";position:absolute;inset:auto -60px -80px auto;width:260px;height:260px;border-radius:50%;background:#ffffff0d}
@media(min-width:760px){.hero{grid-template-columns:1.35fr 1fr}.hero .art{display:block;position:relative;min-height:220px;background:linear-gradient(180deg,#bfe0f5 0%,#eaf5fb 70%,#e9e1c9 70%)}}
.hero .art svg{position:absolute;inset:0;width:100%;height:100%}
.dua{background:linear-gradient(135deg,#fffaf0,#fbf3dc);border:1px solid #ecd9a3;border-radius:16px;padding:16px 18px;margin:14px 0;text-align:center;color:#5d4710;box-shadow:var(--sh)}
.dua .t{font-family:"Amiri","Cairo",serif;font-size:19px;line-height:1.9;direction:rtl}
.dua .h{font-weight:800;color:var(--g);font-size:14px;margin-bottom:4px;letter-spacing:.3px}
.welc{max-width:520px;margin:24px auto 0;border-radius:20px;overflow:hidden;background:linear-gradient(135deg,#17492e,#2E7D50);color:#fff;padding:22px 20px;text-align:center;box-shadow:0 6px 24px #1f5c3a33}
.welc .lg{width:64px;height:64px;border-radius:18px;background:var(--gold);display:grid;place-items:center;font-weight:800;font-size:19px;margin:0 auto 10px;box-shadow:0 4px 14px #0003}
.welc .b{font-family:"Amiri",serif;font-size:22px;color:#f3dc9b}
.welc h3{margin:6px 0 4px;font-size:21px}.welc .sal{margin-top:14px;padding-top:12px;border-top:1px solid #ffffff33}.welc .sal div[dir=rtl]{font-family:"Amiri",serif;font-size:20px;color:#f3dc9b;line-height:1.8}.welc .sal .fr{font-size:13.5px;opacity:.85;margin-top:2px}.welc p{margin:0;opacity:.92;font-size:15.5px;line-height:1.7}
.car{max-width:520px;margin:20px auto 0;position:relative;border-radius:22px;overflow:hidden;background:linear-gradient(135deg,#17492e,#1F5C3A 50%,#2E7D50);box-shadow:0 8px 28px #1f5c3a40;color:#fff;touch-action:pan-y}
.car::before,.car::after{content:"";position:absolute;border-radius:50%;background:#ffffff10;animation:float 9s ease-in-out infinite}
.car::before{width:220px;height:220px;top:-90px;inset-inline-end:-70px}.car::after{width:150px;height:150px;bottom:-60px;inset-inline-start:-40px;animation-delay:-4s}
@keyframes float{50%{transform:translate(18px,14px) scale(1.08)}}
.car .trk{display:flex;transition:transform .7s cubic-bezier(.65,0,.35,1);direction:ltr}
.car .sl{flex:0 0 100%;min-height:340px;padding:26px 48px 54px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;z-index:1}
.car .sl>*{opacity:0;transform:translateY(16px)}
.car .sl.on>*{animation:rise .7s ease forwards}
.car .sl.on>*:nth-child(2){animation-delay:.15s}.car .sl.on>*:nth-child(3){animation-delay:.3s}.car .sl.on>*:nth-child(4){animation-delay:.45s}.car .sl.on>*:nth-child(5){animation-delay:.6s}
@keyframes rise{to{opacity:1;transform:none}}
.car .lg{width:70px;height:70px;border-radius:20px;background:var(--gold);display:grid;place-items:center;font-weight:800;font-size:20px;box-shadow:0 4px 16px #0004;margin-bottom:10px}
.car .sl.on .lg{animation:pop .8s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes pop{0%{opacity:0;transform:scale(.4) rotate(-12deg)}100%{opacity:1;transform:none}}
.car .bs{font-family:"Amiri",serif;font-size:22px;color:#f3dc9b}
.car .ar1{font-size:24px;font-weight:800;margin:8px 0 4px;line-height:1.5}
.car .fr1{font-size:17px;opacity:.92;font-weight:600}
.car .big{font-family:"Amiri",serif;font-size:25px;line-height:1.9;color:#f3dc9b}
.car .duaT{font-family:"Amiri",serif;font-size:19.5px;line-height:1.85}
.car .frs{font-size:13.5px;opacity:.85;margin-top:8px;line-height:1.55}
.car .lab{font-size:13px;font-weight:800;letter-spacing:.5px;color:#f3dc9b;margin-bottom:8px;display:inline-flex;gap:6px;align-items:center}
.car .lab::before,.car .lab::after{content:"";width:22px;height:1px;background:#f3dc9b88}
.car .dots{position:absolute;bottom:16px;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:2}
.car .dots button{width:9px;height:9px;border-radius:9px;border:0;background:#ffffff55;cursor:pointer;padding:0;transition:.35s}
.car .dots button.on{width:28px;background:#f3dc9b}
.car .prog{position:absolute;bottom:0;left:0;height:3px;background:#f3dc9b;z-index:2;width:0}
.car .prog.run{animation:prog var(--dur) linear forwards}@keyframes prog{to{width:100%}}
.car .nv{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:30px;height:30px;opacity:.7;border-radius:50%;border:0;background:#ffffff1f;color:#fff;font-size:20px;cursor:pointer;display:grid;place-items:center}
.car .nv.l{left:8px}.car .nv.r{right:8px}
.lgcard{animation:rise .8s .3s ease forwards;opacity:0;transform:translateY(16px)}
@media(prefers-reduced-motion:reduce){.car .trk{transition:none}.car .sl>*,.lgcard{opacity:1!important;transform:none!important;animation:none!important}.car::before,.car::after{animation:none}}
.pw{position:relative}.pw input{padding-inline-end:52px}
.pw .eye{position:absolute;top:50%;transform:translateY(-50%);inset-inline-end:6px;width:42px;height:38px;border:0;border-radius:10px;background:#eef4ef;color:var(--g);cursor:pointer;display:grid;place-items:center}
.pw .eye:hover{background:#e0ece4}
label.shw{display:flex;align-items:center;gap:8px;font-size:14.5px;color:var(--mut);margin:8px 2px 0;cursor:pointer}label.shw input{width:18px;height:18px;accent-color:var(--g)}

/* ===== Thème Mali ===== */
:root{--mg:#14B53A;--my:#FCD116;--mr:#CE1126;--tri:linear-gradient(90deg,var(--mg) 0 33.34%,var(--my) 33.34% 66.67%,var(--mr) 66.67% 100%)}
html{background:#f3f6f2}
body{background:transparent;position:relative;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:var(--tri);opacity:.22}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 50% 35%,#ffffffc8 0%,#ffffff99 50%,#ffffff40 100%)}
html[dir=rtl] body::before{background:linear-gradient(270deg,var(--mg) 0 33.34%,var(--my) 33.34% 66.67%,var(--mr) 66.67% 100%)}
header{background:linear-gradient(120deg,#123f27,#1F5C3A 55%,#2E7D50);position:sticky}
header::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:4px;background:var(--tri)}
.card,.kpi:not(.main),.mi,#side .brand+*{background:rgba(255,255,255,.80);-webkit-backdrop-filter:blur(12px) saturate(1.2);backdrop-filter:blur(12px) saturate(1.2)}
.card,.kpi,.mi{border:1px solid rgba(255,255,255,.9);box-shadow:0 1px 2px #0000000a,0 8px 24px #1f5c3a14}
.kpi.main{background:linear-gradient(135deg,#145232,#1F5C3A 50%,#2E8B57);box-shadow:0 8px 22px #1f5c3a40}
.kpi b{font-size:24px}
.btn{transition:transform .15s,box-shadow .15s,filter .15s}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn.p{background:linear-gradient(135deg,#1F5C3A,#2E8B57);box-shadow:0 4px 14px #1f5c3a40}
.btn.gold{background:linear-gradient(135deg,#B8912F,#d9ae45);box-shadow:0 4px 14px #b8912f55}
.mi{transition:transform .18s,box-shadow .18s}.mi:hover{transform:translateY(-3px);box-shadow:0 12px 28px #1f5c3a26}
.chip.on{background:linear-gradient(135deg,#1F5C3A,#2E8B57);box-shadow:0 3px 10px #1f5c3a40}
.hero,.car{isolation:isolate}
.hero>.tx::before,.car>.tri{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:var(--tri);z-index:4}
.car>.tri{display:block}
.hero .tx{padding-top:24px}
.flagw{position:absolute;inset:0;z-index:0;opacity:.10;background:var(--tri);mix-blend-mode:screen;pointer-events:none}
@media(min-width:960px){
 header{background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
 header::after{bottom:0;height:3px}
 #side{background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
 #side::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:var(--tri)}
}
#side button.si.on{background:linear-gradient(90deg,#e3f1e8,#eef7f1)}
html[dir=rtl] #side button.si.on{background:linear-gradient(270deg,#e3f1e8,#eef7f1)}
#side button.si.pay{background:linear-gradient(135deg,#1F5C3A,#2E8B57);box-shadow:0 4px 14px #1f5c3a40}
#side .brand .logo{background:linear-gradient(135deg,#B8912F,#e2b94c)}
.logo{background:linear-gradient(135deg,#B8912F,#e2b94c)!important}
.lgcard{border-top:4px solid transparent;border-image:var(--tri) 1;border-radius:0 0 var(--r) var(--r)}
#modal .sheet{background:rgba(244,246,243,.96);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#modal .sheet::before{content:"";display:block;height:4px;margin:-16px -16px 14px;background:var(--tri);border-radius:20px 20px 0 0}
.dua{background:linear-gradient(135deg,rgba(255,250,240,.9),rgba(251,243,220,.9));-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}

.idc{aspect-ratio:85.6/54;min-height:0;height:auto;max-height:none;contain:size layout;width:100%;background:#fff;border-radius:12px;border:1px solid #d6ddd8;box-shadow:0 4px 14px #0000001a;overflow:hidden;position:relative;color:#1d2420;display:flex;flex-direction:column;font-family:Helvetica,Arial,sans-serif;direction:ltr;text-align:left}

.idc .phc{width:27%;flex:none;text-align:center}.idc .phc .ph{width:100%}.idc .mt{font-size:7px;font-weight:700;margin-top:2px}.idc .sh{height:27%}.idc .hh{flex:1;text-align:center;line-height:1.25}.idc .hh div{display:flex;justify-content:center;align-items:baseline;gap:4px;white-space:nowrap}.idc .hh .l1 b{font-size:10px}.idc .hh .l2 b{font-size:10.5px}.idc .hh small{font-size:6.5px;opacity:.85}.idc .hh .l3{display:block;font-size:7.5px;opacity:.9}.idc.stu{background:var(--sb,#FBF7EC);border-color:var(--sbd,#C8AA50)}.idc.stu .ih{background:var(--sg,#0E4A32)}.idc.stu .sh{height:26%;padding:6px 8px 2px 5px;gap:6px}.idc.stu .sh i{width:44px;height:44px}.idc.stu .hh .l1 b{font-size:7.5px}.idc.stu .hh .l2 b{font-size:8.5px}.idc.stu .hh small{font-size:5.2px}.idc.stu .hh .lc{display:block;font-size:7.5px;font-weight:700;color:var(--sa,#DEB028);letter-spacing:.3px}.idc.stu .hh .l3{display:inline-block;font-size:7.6px;color:var(--sd,#0A3424);background:var(--sa,#DEB028);border-radius:9px;padding:1px 9px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;margin-top:2px}
.idc.stu .ib{padding:7px 10px 0;gap:9px;align-items:flex-start}.idc.stu .phc{width:22%}.idc.stu .ph{border:1.5px solid var(--sg,#0E4A32);border-radius:2px}.idc.stu .mt{font-size:6.6px;background:var(--sg,#0E4A32);color:#fff;border-radius:6px;padding:1px 0;margin-top:3px;font-weight:700;letter-spacing:.2px}.idc.stu::before{content:"";position:absolute;left:32%;top:32%;width:36%;aspect-ratio:1;background:var(--logo) center/contain no-repeat;opacity:.045;pointer-events:none}.idc.stu .qr{border:1.5px solid var(--sg,#0E4A32);border-radius:4px;padding:2px}
.idc.stu .idn{flex:1;min-width:0}.idc.stu .nm2{font-size:12.5px;margin:0}.idc.stu .gl{display:block;width:22px;height:2px;background:var(--sa,#DEB028);margin:3px 0 4px}.idc.stu .ln{font-weight:700;color:#000;font-size:10px;line-height:1.3;display:grid;grid-template-columns:44px 1fr;border-bottom:1px solid var(--sl,#d3e0d7);padding:1px 0}.idc.stu .ln b{color:var(--sd,#0A3424);font-size:7.8px;text-transform:uppercase;letter-spacing:.2px;align-self:center}
.idc.stu .qr{position:static;width:16%;flex:none;margin-top:2px}.idc.stu .dl{left:82%;top:62%;transform:translateX(-50%)}.idc.stu .sg{left:63%;top:72%;width:20%}.idc.stu .st{left:80%;top:65.5%;width:12%}

@media(min-width:960px){
 body{--sw:272px}
 #side{display:flex;flex-direction:column;position:fixed;top:0;bottom:0;inset-inline-start:0;width:var(--sw);background:#fff;border-inline-end:1px solid #e3e8e4;z-index:30;padding:18px 14px;overflow:auto}
 #nav{display:none!important}
 header{background:#fff;color:var(--ink);box-shadow:none;border-bottom:1px solid #e3e8e4;margin-inline-start:var(--sw);padding:12px 26px;min-height:66px}
 header .logo,header .ttl{display:none}
 #crumb{display:flex;gap:8px;align-items:center;font-size:15px;color:var(--mut)}#crumb b{color:var(--ink)}
 #who{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mut)}
 #who i{width:36px;height:36px;border-radius:50%;background:#e8f1eb;color:var(--g);display:grid;place-items:center;font-style:normal;font-weight:800}
 #sync{background:#eef4ef;color:var(--g)}
 #lang{background:#eef4ef}
 #out{background:#f3f5f3!important;color:var(--ink)!important;border:1px solid #e3e8e4!important}
 main{margin-inline-start:var(--sw);max-width:none;padding:22px 30px 40px}
 main>*{max-width:1180px;margin-inline:auto}
 #toast{bottom:28px}
 .kpis{grid-template-columns:repeat(4,1fr)}
 .menu{grid-template-columns:repeat(3,1fr)}
}
#side .brand{display:flex;align-items:center;gap:12px;padding:6px 6px 18px;border-bottom:1px solid #eef1ee;margin-bottom:12px}
#side .brand .logo{width:52px;height:52px;border-radius:14px;font-size:16px;box-shadow:0 3px 10px #b8912f55}
#side .brand b{display:block;font-size:17px;line-height:1.25;color:var(--g)}
#side .brand small{color:var(--mut);font-size:13px}
#side .sec{font-size:12.5px;color:var(--mut);margin:12px 10px 6px;font-weight:700}
#side button.si{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:10px 12px;border-radius:12px;font-size:15.5px;color:#2d3631;cursor:pointer;text-align:start}
#side button.si svg{width:21px;height:21px;color:var(--mut);flex:none}
#side button.si:hover{background:#f3f7f4}
#side button.si.on{background:#e6f1ea;color:var(--g);font-weight:800}
#side button.si.on svg{color:var(--g)}
#side button.si.pay{background:var(--g);color:#fff;font-weight:800;margin:4px 0 6px}#side button.si.pay svg{color:#fff}
#side .foot{margin-top:auto;padding-top:12px;border-top:1px solid #eef1ee}
#side{scrollbar-width:thin;scrollbar-color:#2E7D5088 transparent;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}#side::-webkit-scrollbar{width:7px}#side::-webkit-scrollbar-thumb{background:#2E7D5066;border-radius:6px}#side::-webkit-scrollbar-thumb:hover{background:#2E7D50}#side::-webkit-scrollbar-track{background:transparent}
@media(max-height:820px){#side button.si{min-height:38px!important;padding-top:6px!important;padding-bottom:6px!important}#side .sec{margin-top:8px!important}#side .brand{padding-bottom:10px!important;margin-bottom:8px!important}}
</style>

function lettres(n){n=Math.round(n);if(n===0)return"zéro";
 const u=["","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","douze","treize","quatorze","quinze","seize"];
 const t=["","dix","vingt","trente","quarante","cinquante","soixante","soixante","quatre-vingt","quatre-vingt"];
 const b100=n=>{if(n<17)return u[n];if(n<20)return"dix-"+u[n-10];const d=Math.floor(n/10),r=n%10;
  if(d===7||d===9)return t[d]+(d===7&&r===1?" et ":"-")+b100(10+r);
  if(r===0)return t[d]+(d===8?"s":"");if(r===1&&d!==8)return t[d]+" et un";return t[d]+"-"+u[r]};
 const b1000=n=>{const c=Math.floor(n/100),r=n%100;let s="";if(c>0){s=(c>1?u[c]+" ":"")+"cent"+(c>1&&r===0?"s":"");if(r)s+=" "}if(r)s+=b100(r);return s};
 const big=(n,w)=>{const q=Math.floor(n/1e6),m=Math.floor(n%1e6/1000),r=n%1000;let s="";
  if(q>0){s=b1000(q)+" million"+(q>1?"s":"");if(m||r)s+=" "}
  if(m>0){s+=(m>1?b1000(m).replace(/(cent|vingt)s$/,"$1")+" ":"")+"mille";if(r)s+=" "}
  if(r)s+=b1000(r);return s};return big(n)}

function recompute(){paid={};
 for(const p of S.pays.values()){if(p.annule)continue;const ms=p.mois||[];if(!ms.length)continue;const share=(p.montant||0)/ms.length;
  for(const m of ms){(paid[p.mat]??={});paid[p.mat][m]=(paid[p.mat][m]||0)+share}}}
const paidOf=(mat,m)=>(paid[mat]&&paid[mat][m])||0;
function status(st,m){const p=paidOf(st.mat,m),due=st.mens||0;if(due>0&&p>=due-0.5)return"ok";if(p>0)return"part";return m>todayISO().slice(0,7)?"fut":"no"}

function rdue(s,m,force){const md=S.rmode||"late";if(md==="late")return dueUntil(s,m,force);let due=0,miss=[];
 for(const k of MK){if(k>m)break;if(md==="cur"&&k!==m)continue;const r=Math.max((s.mens||0)-paidOf(s.mat,k),0);if(r>0){due+=r;miss.push(k)}}

 if($("#rmod"))$("#rmod").onclick=()=>editReceipt(p);

 $("#rwa").onclick=()=>copyText(`*${SCHOOL}*\n${SCHOOL_ADR} · Tél. : ${SCHOOL_TEL}\nReçu N° ${pad4(p.num)} du ${dFR(p.date)}\nÉlève : ${p.nom} (${p.classe})\nMois : ${(p.mois||[]).map(m=>MLONG[m]).join(", ")}\nMontant : ${F(p.montant)} (${lettres(p.montant)} francs CFA)${reste!==null?`\nReste à payer pour l'année : ${F(reste)}`:""}${p.annule?"\n*REÇU ANNULÉ*":""}\nMerci.`);

  $("#m_ok").disabled=true;try{await signInWithEmailAndPassword(FB.auth,FB.email,pw)}catch(e){$("#m_ok").disabled=false;toast("Mot de passe incorrect · كلمة المرور خاطئة");return}
  const avant={montant:p.montant,mois:p.mois,date:p.date,mode:p.mode};

const accM=x=>x.mois&&typeof x.mois==="string"?x.mois:(x.date||"").slice(0,7);
function payShares(p){const ms=p.mois&&p.mois.length?p.mois:[(p.date||"").slice(0,7)];const sh=(p.montant||0)/ms.length;return ms.map(k=>[k,sh])}
function paysOfMonth(m){const o=[];for(const p of S.pays.values()){if(p.annule)continue;const f=payShares(p).filter(x=>x[0]===m);if(f.length)o.push({...p,montant:f.reduce((a,x)=>a+x[1],0)})}return o}
function moisSel(id,cur,dis){return `<label class="f">${TT("Mois comptable","الشهر المحاسبي")}</label><select id="${id}" ${dis?"disabled":""}>${MK.map(k=>`<option value="${k}" ${k===cur?"selected":""}>${MLONG[k]}</option>`).join("")}</select>`}
function ledgerAt(lim,strict){const ok=k=>strict?k<lim:k<=lim;let cash=0,bank=0,salC=0,salB=0;
 for(const p of S.pays.values()){if(p.annule)continue;for(const[k,v]of payShares(p)){if(!ok(k))continue;if(BANKMODES.includes(p.mode))bank+=v;else cash+=v}}
 for(const b of S.bank.values()){if(b.annule||!ok(accM(b)))continue;if(b.sens==="out"){bank-=b.montant||0;cash+=b.montant||0}else{bank+=b.montant||0;cash-=b.montant||0}}
 for(const x of S.sals.values()){if(x.annule||!ok(x.mois))continue;if(BANKMODES.includes(x.mode)){bank-=x.montant||0;salB+=x.montant||0}else{cash-=x.montant||0;salC+=x.montant||0}}
 for(const d of S.deps.values())if(!d.annule&&d.type==="sol"&&ok(accM(d)))cash-=d.montant||0;
 return{cash,bank,salC,salB}}
function treso(){let cashIn=0,bankIn=0,dep=0,depo=0,sal=0;for(const p of S.pays.values()){if(p.annule)continue;if(BANKMODES.includes(p.mode))bankIn+=p.montant||0;else cashIn+=p.montant||0}
 for(const d of S.deps.values())if(!d.annule)dep+=d.montant||0;let wd=0;for(const b of S.bank.values())if(!b.annule){if(b.sens==="out")wd+=b.montant||0;else depo+=b.montant||0}for(const x of S.sals.values())if(!x.annule)sal+=x.montant||0;
 const L=ledgerAt("9999",false);return{cashIn,bankIn,dep,depo,sal,wd,caisse:L.cash,banque:L.bank}}

function comptePDF(c){const d=pdfDoc();if(!d)return;const W=595,x0=40,x1=W-40;pdfHeader(d,30,"COMPTE MENSUEL · "+MLONG[c.m].toUpperCase()+" · Année "+YL);let y=120;
 const sec=t=>{y+=8;d.setFillColor(232,241,235);d.rect(x0,y,x1-x0,20,"F");d.setFont("helvetica","bold");d.setFontSize(12);d.setTextColor(31,92,58);d.text(t,x0+6,y+14);d.setTextColor(30);y+=30};
 const row=(a,b,bold)=>{if(y>790){d.addPage();y=50}d.setFont("helvetica",bold?"bold":"normal");d.setFontSize(11);d.text(String(a).slice(0,70),x0+8,y);d.text(b,x1-8,y,{align:"right"});d.setDrawColor(225);d.line(x0,y+4,x1,y+4);y+=19};
 const F2=n=>fmt(Math.round(n))+" F";
 sec("1. Frais mensuels");row("Attendu",F2(c.exp));row("Encaissé  ("+c.nPaid+"/"+c.n+" élèves à jour)",F2(c.col));row("Reste à encaisser",F2(c.rem),1);
 sec("2. Encaissements faits en "+MLONG[c.m]);row("Frais du mois",F2(c.cur));row("Arriérés payés (mois précédents)",F2(c.arr));if(c.adv)row("Paiements d'avance",F2(c.adv));row("TOTAL",F2(c.tot),1);row("dont espèces (caisse)",F2(c.cash));row("dont virements / chèques",F2(c.bnk));
 sec("3. Caisse de l'école (espèces)");row("Solde au début du mois",F2(c.openC));row("Espèces encaissées","+ "+F2(c.cash));row("Dépôts en banque","- "+F2(c.dsum));if(c.wsum)row("Retraits de la banque","+ "+F2(c.wsum));if(isAdmin)row("Salaires de "+MLONG[c.m]+(c.salD?"  (payés le "+c.salD+")":""),"- "+F2(c.salC));if(c.expD)row("Dépenses déduites","- "+F2(c.expD));row("SOLDE DE LA CAISSE",F2(c.closeC),1);
 sec("4. Banque");row("Solde au début du mois",F2(c.opening));row("Dépôts du mois ("+c.deps.length+")","+ "+F2(c.dsum));if(c.bnk)row("Virements / chèques directs","+ "+F2(c.bnk));
 if(isAdmin&&c.salB)row("Salaires par virement / chèque","- "+F2(c.salB));c.wds.forEach(w=>row("Retrait "+dFR(w.date)+" : "+(w.motif||"")+(w.note?" - "+w.note:""),"- "+F2(w.montant)));row("SOLDE DE LA BANQUE",F2(c.closing),1);
 sec("5. Dépenses");row("Déduites du solde",F2(c.expD));row("Non déduites",F2(c.expH));c.exps.forEach(e=>row("  "+dFR(e.date)+" · "+(e.libelle||e.cat||"")+(e.type==="sol"?"  (déduite)":""),F2(e.montant)));
 y+=30;if(y>770){d.addPage();y=60}d.setFont("helvetica","bold");d.setFontSize(11);d.text("Le Directeur",x0+20,y);d.text("Le Comptable / Secrétaire",x1-150,y);d.setFont("helvetica","normal");d.setFontSize(8);d.setTextColor(130);d.text("Édité le "+dFR(todayISO()),x0,825);

 bindGo(v);$("#ay").onchange=e=>{lsSet("csw_year",e.target.value);location.reload()};
 if($("#rz_go"))$("#rz_go").onclick=async()=>{const kinds=[...v.querySelectorAll(".rz:checked")].map(x=>x.value);if(!kinds.length){toast("Rien de coché");return}if($("#rz_c").value.trim().toUpperCase()!=="EFFACER"){toast("Tapez EFFACER");return}
  const b=$("#rz_go");b.disabled=true;b.textContent="…";try{exportExcel();await new Promise(r=>setTimeout(r,1500));let n=0;
   const map={pay:["pay",S.pays],dep:["dep",S.deps],bank:["bank",S.bank],sal:["sal",S.sals]};
   for(const k of kinds){for(const [key,x] of [...map[k][1].entries()]){const pt=x._path||(k==="sal"?`sal/${key.split("/")[0]}/s/${key.split("/")[1]}`:null);if(pt){await deleteDoc(fdoc(FB.fs,pt));n++}}}
   if(kinds.includes("pay"))await setDoc(fdoc(FB.fs,"meta/compteur"),{n:0});
   logAct("Données d'essai effacées",kinds.join(", ")+" · "+n+" documents");toast("Terminé ✓ · "+n+" · rechargement…");setTimeout(()=>location.reload(),1500)}catch(e){b.disabled=false;b.textContent="Sauvegarder puis effacer";toast(errMsg(e))}};
 if($("#prom"))$("#prom").onclick=()=>twoStep($("#prom"),"Confirmer ? Cette action modifie tous les élèves",async()=>{const pf={};v.querySelectorAll(".pf").forEach(i=>pf[i.dataset.c]=Math.round(+i.value||0));
  const sts=activeStudents();for(let i=0;i<sts.length;i+=400){const b=writeBatch(FB.fs);for(const st of sts.slice(i,i+400)){const n=NEXT[st.classe];
   b.set(fdoc(FB.fs,"students/"+st.mat),n?{...st,classe:n,mens:pf[n]||st.mens,statut:"Ancien"}:{...st,actif:false,statut:"Sortant"})}await b.commit()}
  logAct("Passage en classe supérieure",`${activeStudents().length} élèves · ${YL}`);toast("Passage effectué ✓");go("eleves")})};

function pdfHeader(d,y0,title){const W=595;d.setFillColor(31,92,58);d.rect(40,y0,W-80,34,"F");d.setTextColor(255);d.setFont("helvetica","bold");d.setFontSize(16);
 d.text(SCHOOL,W/2+14,y0+15,{align:"center"});d.setFont("helvetica","normal");d.setFontSize(9.5);d.text(SCHOOL_ADR+"   ·   Tél. : "+SCHOOL_TEL,W/2+14,y0+28,{align:"center"});d.setFont("helvetica","bold");try{d.setFillColor(255,255,255);d.circle(68,y0+17,25,"F");d.addImage(LOGO_PDF,"PNG",44,y0-7,48,48,"csw_logo","FAST")}catch(e){}if(title){d.setTextColor(31,92,58);d.setFontSize(16);d.text(title,W/2,y0+58,{align:"center"})}d.setTextColor(30)}
function receiptPDF(p,reste,print){const d=pdfDoc();if(!d)return;const W=595,H=842;
 const one=(y0,label)=>{const x0=40,x1=W-40;pdfHeader(d,y0,"REÇU DE PAIEMENT · Année "+YL);
  d.setFontSize(11);d.setTextColor(120);d.setFont("helvetica","normal");d.text(label,W/2,y0+74,{align:"center"});d.setTextColor(184,145,47);d.setFont("helvetica","bold");d.setFontSize(16);d.text("N° "+pad4(p.num),x1,y0+58,{align:"right"});
  const rows=[["Date :",dFR(p.date)],["Élève :",p.nom+"   ("+p.classe+")"],["Matricule :",p.mat],["Mois :",(p.mois||[]).map(m=>MLONG[m]).join(", ")],
   ["Montant :",F(p.montant)],["En lettres :",lettres(p.montant)+" francs CFA"],["Mode :",p.mode+(reste!==null?"      Reste (année) : "+F(reste):"")],["Reçu par :",p.par||""]];
  let y=y0+102;d.setTextColor(30);for(const[a,b]of rows){d.setFont("helvetica","bold");d.setFontSize(16);d.text(a,x0,y);d.setFont("helvetica",a==="Montant :"?"bold":"normal");
   const lines=d.splitTextToSize(b,x1-x0-120);d.text(lines,x0+120,y);d.setDrawColor(200);d.setLineDashPattern([1,2],0);d.line(x0+118,y+4,x1,y+4);d.setLineDashPattern([],0);y+=27*Math.max(1,lines.length)}
  d.setFont("helvetica","bold");d.setFontSize(14);d.text("Signature et cachet :",x1-200,y+6);
  if(p.annule){d.setTextColor(192,57,43);d.setFontSize(48);d.text("ANNULÉ",W/2,y0+230,{align:"center",angle:12})}};
 one(30,"Exemplaire PARENT");d.setDrawColor(150);d.setLineDashPattern([6,4],0);d.line(15,H/2,W-15,H/2);d.setLineDashPattern([],0);
 d.setFontSize(9);d.setTextColor(150);d.text("- - - découper ici - - -",20,H/2-4);one(H/2+20,"Exemplaire ÉCOLE");
 const fn=`Recu_${pad4(p.num)}_${p.nom.replace(/[^A-Za-z0-9À-ÿ]+/g,"_")}.pdf`;print&&canBridgePrint()?bridgePrint(fn,d.output("blob")):saveFile(fn,d.output("blob"))}
function convocationPDF(list,m,force){const items=list.map(s=>({s,...dueUntil(s,m,force)})).filter(x=>x.due>0);if(!items.length){toast("Aucun impayé jusqu'à "+MLONG[m]);return}
 const d=pdfDoc();if(!d)return;const W=595,x0=60,x1=W-60;
 items.forEach((it,i)=>{if(i)d.addPage();pdfHeader(d,40,null);let y=120;d.setFont("helvetica","normal");d.setFontSize(16);
  d.text("Bamako, le "+dFR(todayISO()),x1,y,{align:"right"});y+=40;d.setFont("helvetica","bold");
  d.text("Aux parents de l'élève : "+fullName(it.s),x0,y);y+=24;d.setFont("helvetica","normal");d.text("Classe : "+it.s.classe+"      Matricule : "+it.s.mat,x0,y);y+=40;
  d.setFont("helvetica","bold");d.text("Objet : Rappel des frais de scolarité",x0,y);y+=36;d.setFont("helvetica","normal");
  const body=[`Madame, Monsieur,`,"",`Nous avons l'honneur de vous informer que les frais de scolarité de votre enfant restent impayés pour : ${it.miss.map(k=>MLONG[k]).join(", ")}.`,"",
   `Montant total dû : ${F(it.due)} (${lettres(it.due)} francs CFA).`,"",`Rappel : les frais de scolarité sont exigibles avant le 5 du mois suivant. Nous vous prions de bien vouloir régulariser cette situation auprès de la caisse de l'école dans les meilleurs délais. Pour toute difficulté, la Direction reste à votre disposition.`,"",
   `Veuillez agréer, Madame, Monsieur, l'expression de nos salutations distinguées.`];
  for(const para of body){if(!para){y+=10;continue}const L=d.splitTextToSize(para,x1-x0);d.text(L,x0,y);y+=L.length*22}
  y+=40;d.setFont("helvetica","bold");d.text("La Direction",x1-140,y)});
 saveFile(`Lettres_parents_${m}${items.length===1?"_"+items[0].s.mat:""}.pdf`,d.output("blob"))}

const HAS_AR=/[؀-ۿ]/;
function isoNum(s){if(s.includes("\u2066"))return s;return s.replace(/[A-Z]{2,}-\d{4}-\d{3}|\d{4}-\d{4}|(?:[−-]\s)?\d[\d \u00a0.,\/:%]*\d(?:\s?F\b)?|\d(?:\s?F\b)?/g,m=>"\u2066"+m+"\u2069")}
function trAR(t){const raw=t;let s=t.trim();if(!s)return raw;if(!/[A-Za-zÀ-ÿ]/.test(s)){return /\d/.test(s)&&/[\s%\/]/.test(s)?raw.replace(s,isoNum(s)):raw}
 {const mm=s.match(/^Gestion (\d{4}-\d{4}) · إدارة المدرسة$/);if(mm)return raw.replace(t.trim(),isoNum("إدارة المدرسة "+mm[1]))}if(s.includes(" · ")){const parts=s.split(" · ");const i=parts.findIndex(p=>HAS_AR.test(p));if(i>0){const yr=(parts[0].match(/20\d\d/)||[])[0];let r=parts.slice(i).join(" · ");if(yr&&!/\d/.test(r))r+=" "+yr;s=r;if(!/[A-Za-zÀ-ÿ]/.test(s))return raw.replace(t.trim(),isoNum(s))}}
 if(AR_EXACT[s]!==undefined)return raw.replace(t.trim(),isoNum(AR_EXACT[s]));
 for(const[rx,rep]of AR_RX)if(rx.test(s)){s=s.replace(rx,rep);break}
 for(const[a,b]of AR_SUB)if(s.includes(a))s=s.split(a).join(b);
 const parts=s.split(" · ").map(p=>AR_EXACT[p.trim()]??p);s=parts.join(" · ");
 return raw.replace(t.trim(),isoNum(s))}

function trX(t){return LANG==="ar"?trAR(t):trFR(t)}
function trNode(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const todo=[];let n;
 while(n=w.nextNode()){if(n.parentElement&&n.parentElement.closest("script,style,input,textarea,[data-notr]"))continue;todo.push(n)}

 if(root.querySelectorAll){const els=[...root.querySelectorAll("[placeholder],[title]")];if(root.matches&&root.matches("[placeholder],[title]"))els.push(root);els.forEach(e=>{if(e.placeholder){const v=trX(e.placeholder);if(v!==e.placeholder)e.placeholder=v}if(e.title){const v=trX(e.title);if(v!==e.title)e.title=v}})}}
